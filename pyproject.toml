[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ltspice-plotter"
version = "0.1.0"
description = "Bridge between LTspice and Matplotlib/tikzplotlib"
authors = [{name = "Moritz Heinzmann"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.8"
keywords = ["ltspice", "matplotlib", "plotting", "simulation"]

dependencies = [
    "pandas>=1.3.0",
    "matplotlib>=3.5.0",
    "spicelib == 1.4.5"
]

optional-dependencies.dev = [
    "pytest>=7.0",
    "tikzplotlib>=0.10.0",  # For later milestones
]

[project.scripts]
ltspice-plot = "ltspice_plotter.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
