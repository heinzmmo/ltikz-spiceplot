[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ltikz-spiceplot"
version = "0.1.0"
description = "Bridge between LTspice and Matplotlib/matplot2tikz"
authors = [{name = "Moritz Heinzmann"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.8"
keywords = ["ltspice", "matplotlib", "plotting", "simulation"]

dependencies = [
    "pandas>=1.3.0",
    "matplotlib>=3.5.0",
    "spicelib == 1.4.5",
    "matplot2tikz >= 0.4.1"
]

[project.scripts]
lt2tikzplot = "ltikz_spiceplot.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
